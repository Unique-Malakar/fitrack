name: Daily Market Brief

on:
  schedule:
    # 11:10 UTC = 07:10 ET (EDT) / 06:10 ET (EST), before the 09:30 open either way.
    # GitHub's scheduler queues on shared runners and can drift 5-15 minutes at peak
    # times, so this is set early enough to absorb that.
    - cron: "10 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but do not send email"
        type: boolean
        default: true

concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dashboard_built: ${{ steps.check.outputs.built }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The pipeline is stdlib-only, so there is nothing to install for the core run.
      - name: Run tests
        run: python -m unittest discover -s tests

      # continue-on-error matters here. Email and the dashboard are independent
      # deliverables, and an unset SMTP password used to abort this step, which
      # skipped Pages publishing entirely - losing a dashboard that had already been
      # built successfully. The job still reports failure at the end, so a broken
      # email is visible; it just no longer takes the dashboard down with it.
      - name: Generate brief and dashboard
        id: build
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # inputs.dry_run is "" on a schedule event, "true"/"false" on manual runs.
          # Test for "true" so a scheduled run falls through and actually sends.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: building only, no email."
            python -m src.main --dashboard --dry-run
          else
            python -m src.main --dashboard
          fi

      - name: Check what was produced
        id: check
        if: always()
        run: |
          if [ -s build/dashboard.html ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "Dashboard built: $(wc -c < build/dashboard.html) bytes"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No dashboard produced."
          fi

      - name: Assemble Pages site
        if: always() && steps.check.outputs.built == 'true'
        run: |
          mkdir -p site
          cp build/dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.check.outputs.built == 'true'
        with:
          path: site

      # The snapshot history is the dataset the dashboard charts, so it has to
      # survive the runner being destroyed.
      - name: Commit snapshot
        if: always() && steps.check.outputs.built == 'true' && inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload debug output on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: brief-debug
          path: build/
          if-no-files-found: ignore
          retention-days: 7

      # Surface the failure only after the dashboard has been safely published.
      - name: Report brief failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::The brief step failed. If the dashboard published, this is"
          echo "::error::most likely a missing or wrong SMTP_PASSWORD secret."
          exit 1

  deploy-dashboard:
    needs: brief
    # Deploy whenever a dashboard exists, even if emailing failed.
    if: always() && needs.brief.outputs.dashboard_built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Requires Settings -> Pages -> Source set to "GitHub Actions".
      - id: deploy
        uses: actions/deploy-pages@v5
